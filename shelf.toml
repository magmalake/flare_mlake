name = "flare_mlake"
version = "0.10.0"
description = "Packaged build of flare by Ehsan M. Kermani (github.com/ehsanmok/flare) — TCP, UDP, TLS, HTTP/1.1, HTTP/2, HTTP/3, QUIC, WebSocket and gRPC for Mojo. Republished only because flare is not on a conda channel; imported as `flare`. Please send stars and issues upstream."
tags = ["flare", "networking", "http", "http2", "grpc", "tls", "websocket", "quic", "redistribution", "magmalake"]
# other tins this one depends on; omit if none
# `flare.http` imports `json`, and this package depends on json_mlake rather
# than vendoring json's source — otherwise both would install lib/mojo/json/*
# and conflict in any environment that wants json directly too.
# mozz_mlake is deliberately absent: it is only used by the fuzz feature when
# developing flare itself, never by the published package.
# threads-mojo joined the list when flare's threading became an adapter over
# it: flare no longer binds pthread itself, so the dependency is real at both
# compile and run time.
tins = ["json_mlake", "threads-mojo"]
