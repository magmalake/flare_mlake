name: CI

on:
  push:
    branches: [main]
  pull_request:

# This repository is a *distribution* of an upstream project, not its
# development home, so CI asks the question a distribution has to answer:
# does the package build on every platform we ship, and can a consumer
# actually resolve and import it? Upstream's own test suite is upstream's
# to run — re-running it here would test their code, not our packaging.
jobs:
  # A release PR (only versions, CHANGELOG.md, revs and locks change; see
  # tools/release_only.py in magmalake/.github) skips the macOS, nightly and
  # extra jobs below and runs a consumer build of the PR head instead. Every
  # other PR runs everything. The verdict is its own fast job because the jobs
  # below wait for it; the builds are the next one.
  release:
    if: github.event_name == 'pull_request'
    uses: magmalake/.github/.github/workflows/release-check.yml@release-check
    permissions:
      contents: read
      pull-requests: read
    with:
      classify-only: true
      tools-ref: "release-check"

  package:
    needs: release
    if: ${{ !cancelled() }}
    name: package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is linux-64, macos-latest is osx-arm64 — the two
        # platforms magmalake ships. linux-64 matters because the taxibench
        # containers are built there.
        os: ${{ fromJSON(needs.release.outputs.release_only == 'true' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # Pinned to match every other magmalake repo (mojoshelf tins.toml).
          pixi-version: v0.78.0
          run-install: false

      # `rattler-build` rather than a pixi source build: the recipe is what
      # produces the published artifact, and it is also the only path that
      # sidesteps the dead `pixi-build-rattler-build ==0.3.13` pin upstream
      # carries. `pixi exec` runs it from a throwaway environment.
      - name: Build the package
        run: |
          pixi exec rattler-build build \
            --recipe recipe.yaml \
            --output-dir ./out \
            -c https://conda.modular.com/max-nightly \
            -c conda-forge

      # rattler-build writes a usable channel (per-subdir repodata.json beside
      # the packages) but also build scratch — bld/, src_cache/, .tmp/, test/.
      # Copy just the channel subdirs out, so the artifact is a channel rather
      # than a pile of .conda files: uploading only *.conda loses repodata.json
      # and the solve then fails with "could not find subdir 'noarch'".
      - name: Assemble the channel
        shell: bash
        run: |
          mkdir -p channel
          for d in noarch linux-64 osx-arm64; do
            [ -d "out/$d" ] && cp -R "out/$d" channel/
          done
          find channel -type f \( -name '*.conda' -o -name 'repodata.json' \) -exec ls -lh {} +

      - uses: actions/upload-artifact@v4
        with:
          name: conda-${{ matrix.os }}
          path: channel/
          if-no-files-found: error

  consume:
    name: consume / ${{ matrix.os }}
    needs: [release, package]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.release.outputs.release_only == 'true' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: conda-${{ matrix.os }}
          path: ./channel

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          run-install: false

      # The test that matters: a project that has never seen this source tree
      # installs the built package from a local channel and compiles against
      # it with no `-I` flag. That is exactly what a consumer does, and it is
      # what caught the module-resolution details during packaging.
      - name: Consume the package from a clean project
        shell: bash
        run: bash .github/consume-smoke.sh

  # flare_mlake carries four features that are still open pull requests
  # upstream, so unlike the other redistributions it does run tests: these are
  # the parts no upstream CI covers yet, plus the modules Arrow Flight will be
  # built on. Not the full ~300-invocation `tests` task — that includes
  # io_uring (Linux-only) and a cargo build for the rustls QUIC FFI, and it is
  # upstream's suite to keep green.
  tests:
    needs: release
    if: ${{ !cancelled() }}
    name: tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.release.outputs.release_only == 'true' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      # flare's threading is an adapter over threads.mojo rather than its own
      # pthread binding, so `threads` has to be on the include path to compile
      # flare at all. Consumed as a source-path sibling, the way every other
      # magmalake repo consumes it.
      - uses: actions/checkout@v4
        with:
          repository: magmalake/threads.mojo
          path: threads.mojo

      # threads.mojo 0.6.0 has a single compat/ directory: Mojo 1.2.0 and the
      # nightly agree on `Atomic[Int64]`, which is all it papers over.
      - name: Threads include path
        run: |
          echo "THREADS_I=-I $GITHUB_WORKSPACE/threads.mojo/src -I $GITHUB_WORKSPACE/threads.mojo/compat" >> $GITHUB_ENV

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: default

      # The four carried pull requests (upstream #11, #14, #15, #16). If one
      # of these breaks, the carried patch is what broke — that is the whole
      # reason to run tests in a distribution repo at all.
      # This distribution's library search (flare/utils/_dlopen.mojo), also
      # built and run with CONDA_PREFIX unset, as from a plain shell.
      - name: Library search
        run: |
          pixi run mojo -I . $THREADS_I tests/test_dylib.mojo
          mkdir -p build
          pixi run mojo build -I . $THREADS_I tests/test_dylib.mojo -o build/test_dylib
          env -u CONDA_PREFIX ./build/test_dylib

      - name: Carried upstream PRs
        run: |
          pixi run mojo -I . $THREADS_I tests/http/test_client_read_timeout.mojo
          pixi run mojo -I . $THREADS_I tests/http/test_server_ws_upgrade.mojo
          pixi run mojo -I . $THREADS_I tests/http/test_server_ws_offload.mojo
          pixi run mojo -I . $THREADS_I tests/ws/test_ws.mojo

      # gRPC is the reason magmalake wants flare: Arrow Flight is a gRPC
      # service, so these are the paths a Flight server depends on.
      - name: gRPC
        run: |
          pixi run mojo -I . $THREADS_I tests/grpc/test_grpc.mojo
          pixi run mojo -I . $THREADS_I tests/grpc/test_metadata.mojo
          pixi run mojo -I . $THREADS_I tests/grpc/test_grpc_client.mojo
          pixi run mojo -I . $THREADS_I tests/grpc/test_grpc_server_stream.mojo
          pixi run mojo -I . $THREADS_I tests/grpc/test_grpc_compression.mojo

      - name: HTTP, TLS, net, crypto
        run: |
          pixi run mojo -I . $THREADS_I tests/http/test_http.mojo
          pixi run mojo -I . $THREADS_I tests/http2/test_h2_frame.mojo
          pixi run mojo -I . $THREADS_I tests/http2/test_h2_hpack.mojo
          pixi run mojo -I . $THREADS_I tests/tls/test_tls.mojo
          pixi run mojo -I . $THREADS_I tests/net/test_net.mojo
          pixi run mojo -I . $THREADS_I tests/net/test_fcntl_decl.mojo
          pixi run mojo -I . $THREADS_I tests/crypto/test_base64.mojo
          pixi run mojo -I . $THREADS_I tests/crypto/test_hmac.mojo

  # The one check to require: every job above passed or, on a release-only PR,
  # was skipped in favour of the release job's consumer build.
  ci:
    if: ${{ always() }}
    needs: [release, package, consume, tests]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          release = needs.pop("release")
          build = needs.pop("release-check", {"result": "skipped"})
          release_only = release["outputs"].get("release_only") == "true"
          ok = {"success", "skipped"} if release_only else {"success"}
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ok}
          for k, v in (("release", release), ("release-check", build)):
              if v["result"] not in ("success", "skipped"):
                  bad[k] = v["result"]
          print("release-only:", release_only, "results:", {k: v["result"] for k, v in needs.items()})
          if bad:
              sys.exit(f"did not succeed: {bad}")
          PY
