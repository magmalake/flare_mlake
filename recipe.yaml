# rattler-build recipe for flare
# Distributes flare and its inlined json dependency as their *source* trees
# under $PREFIX/lib/mojo/ rather than as pre-compiled .mojopkg artifacts —
# same shape as ehsanmok/sqlite. Consumers' Mojo resolves
# ``from flare.http import ...`` and the transitive ``from json import ...``
# directly from these source files at their own compile time.
#
# Why source-level distribution rather than ``mojo package``:
#   1. A ``.mojopkg`` produced by ``mojo package`` embeds the compiler
#      version it was built with and refuses to load against any other
#      version (``Mojo package is incompatible: package version X is
#      newer/older than compiler version Y``). That tightly couples the
#      published .conda artifact to a specific Mojo version, so even a
#      benign Mojo bump on the consumer side invalidates flare overnight.
#   2. ``mojo package`` also adds an extra Mojo run during the recipe
#      build, which a stale build cache or an unrelated Mojo toolchain
#      issue can break in ways unrelated to flare's own source.
# Source distribution sidesteps both: the .conda has zero ABI-locked
# binary content from Mojo, only the source files plus the C++ FFI .so's.
# The ``run: mojo == ...`` pin in the requirements still tells solvers
# which compiler to use — the difference is the lock now lives where
# it's easy to update (a one-line bump in this recipe), not embedded in
# a binary blob.
#
# json source is inlined from the git branch named in the ``source:``
# block below (whose own recipe pins the same Mojo version) until json
# publishes to a public conda channel; at that point the inline ``json``
# source step + the ``cp -r json-src/json`` can be replaced with a
# ``host: [json]`` requirement.
#
# What this package does NOT ship: ``libflare_rustls_quic.so``, the
# rustls cdylib that backs QUIC and therefore HTTP/3 TLS. Building it
# needs a Rust toolchain and a crates.io fetch, and a conda build runs
# offline, so a vendored-crate step has to come first. Until it does, a
# conda-installed flare serves and speaks HTTP/1.1, HTTP/2 and
# WebSocket over OpenSSL TLS, and HTTP/3 is unavailable: the FFI lookup
# fails at first use with a clear error rather than silently
# downgrading. Build from source (``pixi run build-rustls-quic``) if
# you need h3.

context:
  # The *package* is flare_mlake; the *module* it installs is still `flare`.
  # Renaming only the package keeps every import unchanged, so switching to an
  # official flare package later is a one-line dependency change.
  name: flare_mlake
  version: "0.10.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # flare source only. json is NOT vendored here: it ships as its own package,
  # json_mlake, and is a run dependency below. Upstream's recipe inlines json's
  # source and builds its simdjson wrapper, which would make this package and
  # json_mlake both install lib/mojo/json/* and lib/libsimdjson_wrapper.so —
  # a file conflict the moment an environment wants both, which any consumer
  # using JSON directly alongside flare would hit.
  - path: .

build:
  script:
    - mkdir -p $PREFIX/lib/mojo
    # ── flare source staged under $PREFIX/lib/mojo/ ──────────────────────
    # Mojo discovers this the same way it discovers .mojopkg files in that
    # directory; no ``mojo package`` step required. json arrives the same way
    # from the json_mlake package.
    - cp -r flare $PREFIX/lib/mojo/
    # ── flare: OpenSSL TLS FFI wrapper ───────────────────────────────────
    - $CXX -O2 -std=c++17 -fPIC -DNDEBUG -shared
        -o $PREFIX/lib/libflare_tls.so
        flare/tls/ffi/openssl_wrapper.cpp
        -I$PREFIX/include
        -L$PREFIX/lib
        -lssl -lcrypto
        -Wl,-rpath,$PREFIX/lib
    # ── flare: zlib FFI wrapper (Content-Encoding gzip / deflate) ────────
    # Upstream's, taken here: loaded at runtime by flare.http.encoding, the
    # compression middleware and the file server. Its absence is not a build
    # error, only a runtime one at the first compressed response.
    #
    # Upstream also builds json's simdjson wrapper from a cloned json tree.
    # This distribution does not: it depends on the json_mlake package, which
    # ships that wrapper itself.
    - $CC -O2 -fPIC -shared
        -o $PREFIX/lib/libflare_zlib.so
        flare/http/ffi/zlib_wrapper.c
        -I$PREFIX/include
        -L$PREFIX/lib
        -lz
        -Wl,-rpath,$PREFIX/lib

requirements:
  build:
    - ${{ compiler('c') }}     # zlib wrapper
    - ${{ compiler('cxx') }}   # OpenSSL wrapper
  host:
    # Matches the pin in pixi.toml. This read `>=3.0,<4`, which would
    # solve to an OpenSSL the library has never been built against.
    - openssl >=3.6.1,<4
    - ca-certificates
    # Headers and libz for the zlib wrapper built above. Upstream declares
    # this for the same reason; taking its build step without its host
    # dependency is what broke the linux-64 package job.
    - zlib >=1.3.1,<2
  run:
    # Upstream's pin, unwidened. This used to be widened to admit Mojo 1.0.0
    # because magmalake still built on it; the whole stack is on 1.1.0 now and
    # upstream's `Atomic[T]` spelling requires it, so there is nothing left to
    # widen for.
    - mojo >=1.1.0,<2.0.0
    - openssl >=3.6.1,<4
    - ca-certificates
    # libflare_zlib.so is built above and dlopened at runtime.
    - zlib >=1.3.1,<2
    # `flare.http` imports `json`. Depending on the package rather than
    # vendoring its source keeps `lib/mojo/json/*` owned by exactly one
    # package, so an environment can hold both flare and json without a
    # file conflict — and json security fixes arrive by upgrading json_mlake
    # rather than by rebuilding flare.
    - json_mlake >=0.4.0,<0.5
    # flare's threading is an adapter over threads.mojo rather than its own
    # pthread binding, so `threads` has to be importable wherever flare is.
    # Having exactly one library bind a given libc symbol is what lets flare
    # be linked alongside the rest of the magmalake stack at all.
    # 0.6.0 is the Mojo 1.1.0 release; it also collapsed `compat/` to one
    # directory, which only source consumers see.
    - threads-mojo >=0.6.0,<0.7

about:
  homepage: https://github.com/ehsanmok/flare
  repository: https://github.com/ehsanmok/flare
  documentation: https://github.com/ehsanmok/flare
  license: MIT
  license_file: LICENSE
  summary: Packaged build of flare (ehsanmok/flare) — networking for Mojo, imported as `flare`
  description: |
    THIS IS A REDISTRIBUTION. All of the code in this package is flare, by
    Ehsan M. Kermani <https://github.com/ehsanmok/flare>, used under the MIT
    licence. It is republished here only because flare is not currently
    published to any conda channel, which prevents pixi from resolving it.
    Please direct stars, issues and pull requests upstream, not to the
    repackager. This package should be abandoned in favour of an official
    flare package as soon as one exists.

    Packaged by the magmalake project: https://github.com/magmalake/flare_mlake

    The module is imported as `flare` (not `flare_mlake`).

    flare is a networking library for Mojo. Servers and clients on
    every wire, over one epoll / kqueue / io_uring reactor:

    - HTTP/1.1, HTTP/2 (RFC 9113) and HTTP/3 over QUIC (RFC 9000/9114)
    - A router, typed extractors, middleware, sessions, cookies,
      server-sent events, templates, static files and RFC 9111 caching
    - An HTTP client with connection pooling, redirects, retries,
      a cookie jar, and streaming request and response bodies on
      every wire
    - WebSocket (RFC 6455), including permessage-deflate and
      Extended CONNECT over HTTP/2 (RFC 8441)
    - gRPC: unary and all three streaming shapes, interceptors,
      reflection and health
    - TLS 1.2+ via OpenSSL FFI, with mTLS, session resumption and ALPN
    - TCP, UDP, Unix sockets, DNS resolution and address types

    This package does not include the rustls cdylib that backs QUIC,
    so HTTP/3 is unavailable from a conda install. Everything else
    works. Build from source if you need it.
